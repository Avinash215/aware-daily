<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Aware Daily — a single, finite daily news briefing. Read it once, then get on with your day."
    />
    <link rel="canonical" href="https://avinash215.github.io/aware-daily/" />
    <meta property="og:title" content="Aware Daily" />
    <meta
      property="og:description"
      content="An automated daily briefing that summarizes reporting from named news organizations and links to original coverage."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://avinash215.github.io/aware-daily/" />
    <meta property="og:site_name" content="Aware Daily" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&display=swap"
      rel="stylesheet"
    />
    <title>Aware Daily</title>
    <script>
      // Apply the stored theme before first paint so a forced light/dark
      // choice never flashes the system theme. Silently no-ops when storage
      // is blocked (private browsing, embedded webviews).
      (function () {
        try {
          var stored = window.localStorage.getItem('aware-daily:theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (error) {
          void error
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
